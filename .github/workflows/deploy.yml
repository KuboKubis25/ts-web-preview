name: Deploy Testing Service preview

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  SITE: https://kubokubis25.github.io
  BASE_PATH: /ts-web-preview/
  PUBLIC_INDEXABLE: "false"
  PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install, validate, build and upload
        uses: withastro/action@v6
        with:
          node-version: "22.23.4"
          package-manager: npm
          build-cmd: npx playwright install --with-deps chromium && npm run check && npm run build && npm run check:links

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v5
